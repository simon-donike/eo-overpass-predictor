name: overpass
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Core dependencies: keep aligned with pyproject.toml.
  - skyfield
  - numpy
  - pandas>=2
  - geopandas>=0.14
  - shapely>=2
  - pyproj
  - timezonefinder
  - requests
  - tzdata            # IANA zone database (required on Windows for zoneinfo)
  # Optional notebook dependencies, installed here for the full workflow.
  - jupyterlab>=4
  - ipykernel>=6
  - ipywidgets>=8
  - ipyleaflet>=0.19
  - folium
  - matplotlib
  - pyyaml

# After creating/updating this environment, install the local package with:
# conda run -n overpass python -m pip install -e . --no-deps
